<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CHANGE: title and description for each post -->
  <title>Post Title Here | Nico Ramos</title>
  <meta name="description" content="A short description of this post for SEO and link previews." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="blog.css" />
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="../index.html" class="nav-logo">Nico</a>
    <ul id="nav-menu">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../index.html#projects">Projects</a></li>
      <li><a href="../index.html#skills">Skills</a></li>
      <li><a href="./" class="blog-nav-active">Blog</a></li>
      <li><a href="../index.html#contact">Connect</a></li>
    </ul>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
      <i class="fas fa-moon" id="themeIcon"></i>
    </button>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </nav>

  <!-- Post Header -->
  <section class="blog-post-header">
    <div class="container">
      <a href="./" class="blog-post-back"><i class="fas fa-arrow-left"></i> All posts</a>

      <h1>Post Title Here</h1>
      <div class="blog-post-meta">

        <time datetime="2026-02-13"></time>
        <span>&middot;</span>
        <!-- CHANGE: read time -->
        <span>3 min read</span>
      </div>
    </div>
  </section>

  <!-- Post Content (add class="no-copy" to discourage copying) -->
  <section class="blog-post-content no-copy">
    <div class="container">

      <p>  </p>

     


      <blockquote>A quote or key takeaway </blockquote>

      <h2>What I Learned</h2>



      <hr>

      <p style="color: var(--text-muted); font-size: 0.9rem;">Thanks  <a href="./">the blog</a>.</p>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="currentYear"></span> Nico™  All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    function toggleTheme() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      var icon = document.getElementById('themeIcon');
      if (!icon) return;
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        updateThemeIcon();
      }
    });

    updateThemeIcon();

    function toggleMenu() {
      document.getElementById('nav-menu').classList.toggle('active');
    }

    // Discourage copy (deterrence only — not a security measure)
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'u' || e.key === 'a')) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
