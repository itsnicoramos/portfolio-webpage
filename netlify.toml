# Netlify builds this site with its Next.js runtime (OpenNext adapter), which
# Netlify detects and installs automatically for Next.js projects.
#
# Security headers (CSP, HSTS, frame and referrer policy) live in
# next.config.ts so they apply the same way locally and on Netlify.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
