# ═══════════════════════════════════════════════════════════════
# netlify.toml — Netlify site configuration
# ═══════════════════════════════════════════════════════════════

[build]
  publish   = "."
  functions = "netlify/functions"

# ── Security headers applied to every response ─────────────────
[[headers]]
  for = "/*"

  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Stop browsers from MIME-sniffing the response type
    X-Content-Type-Options = "nosniff"

    # Basic XSS filter (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Only send origin in the Referer header, never the full URL
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable device APIs that this site doesn't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

    # Force HTTPS for 1 year + include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content-Security-Policy
    # Allows only the CDNs actually used by the site:
    #   • cdnjs.cloudflare.com  → Font Awesome, Three.js
    #   • fonts.googleapis.com  → Google Fonts CSS
    #   • fonts.gstatic.com     → Google Fonts files
    #   • cdn.jsdelivr.net      → devicons / simple-icons
    #   • cdn.jsdelivr.net/npm  → OpenAI / Anthropic SVG icons
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm/ data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

    # Remove server fingerprinting headers
    X-Powered-By  = ""
    Server        = ""

# ── Extra lock-down for the admin page ──────────────────────────
# Forces admins to always use HTTPS and never be framed
[[headers]]
  for = "/admin/*"

  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"

# ── Redirect: block direct access to the functions directory ────
# (Netlify functions are already at /.netlify/functions/, not /netlify/)
[[redirects]]
  from   = "/netlify/*"
  to     = "/404.html"
  status = 404
  force  = true
