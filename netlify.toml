# Netlify builds this site with its Next.js runtime (OpenNext adapter).
# The plugin is declared explicitly: this site was created as a Vite site, so
# Netlify does not auto-detect Next.js, and without the plugin it publishes
# the raw .next folder as static files (every page 404s).
#
# Security headers (CSP, HSTS, frame and referrer policy) live in
# next.config.ts so they apply the same way locally and on Netlify.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
